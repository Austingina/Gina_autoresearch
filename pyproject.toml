[project]
name = "autoresearch-fgr"
version = "0.1.0"
description = "Autoresearch framework for Foundation Goal Representation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
train = [
    "torch>=2.0",
    "h5py>=3.8",
    "opencv-python-headless>=4.8",
    "imageio>=2.31",
]
visual = [
    "matplotlib>=3.7",
    "opencv-python>=4.8",
    "imageio>=2.31",
]
maniskill = [
    "gymnasium>=0.29",
    "mani-skill>=3.0",
]
dev = [
    "pytest>=7.0",
]

[project.scripts]
fgr-run = "run_experiment:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["goals*"]
