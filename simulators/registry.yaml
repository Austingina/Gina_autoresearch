# Simulator platform registry
# Paths default to $AUTORESEARCH_ROOT/simulators/<id> unless overridden by env.

platforms:
  isaaclab:
    id: isaaclab
    display_name: Isaac Lab
    role: primary
    env_var: ISAACLAB_ROOT
    default_relpath: simulators/isaaclab
    launcher: isaaclab.sh
    conda_env: env_isaaclab
    tasks:
      - Isaac-Lift-Cube-Franka-Vision-Teacher-Student-v0
    notes: >
      Vendored into AutoResearch (source + install scripts). Large runs/ and
      datasets/ stay local and gitignored. Isaac Sim installs into conda, not
      into this tree.

  maniskill:
    id: maniskill
    display_name: ManiSkill
    role: secondary
    env_var: MANISKILL_ROOT
    default_relpath: simulators/maniskill
    python_extra: "[maniskill]"
    bridge: goals/maniskill_bridge.py
    notes: >
      Thin adapter directory; pip extra installs ManiSkill. Used for validation /
      transfer pilots, not the main lift DAgger loop.

  arena:
    id: arena
    display_name: Isaac Lab Arena
    role: optional
    env_var: ARENA_ROOT
    default_relpath: simulators/arena
    notes: >
      Optional; may remain an external clone until vendored.

  calvin:
    id: calvin
    display_name: CALVIN
    role: phase1_primary
    env_var: CALVIN_G_ROOT
    default_relpath: phase1_calvin/calvin_g
    conda_env: calvin_h200
    code_env_var: CALVIN_CODE
    launcher: framework/scripts/run_calvin_dualcam.sh
    notes: >
      External workspace (not nested under simulators/). Link phase1_calvin/*
      to $CALVIN_G_ROOT. Train with torch 2.3.1+cu121 (sm_90) on H200.
      See docs/ENVIRONMENTS.md and docs/progress_phase1_calvin.md.
